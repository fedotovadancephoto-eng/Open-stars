<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPEN STARS — Электронный дневник</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f5f4f8;
  color:#171717;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:28px;
  padding:38px 25px;
  box-shadow:0 10px 35px rgba(0,0,0,.06);
}

.logo{
  text-align:center;
  font-size:58px;
}

h1{
  text-align:center;
  margin:10px 0 5px;
  font-size:34px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:32px;
}

h2{
  margin:0 0 20px;
  font-size:24px;
}

label{
  display:block;
  font-size:14px;
  font-weight:600;
  margin:15px 0 7px;
}

input,select{
  width:100%;
  padding:15px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:16px;
  background:white;
}

button{
  width:100%;
  border:0;
  border-radius:16px;
  padding:16px;
  margin-top:22px;
  background:#171717;
  color:white;
  font-size:18px;
  font-weight:600;
}

.status{
  text-align:center;
  color:#888;
  margin-top:25px;
  font-size:14px;
}

#error{
  color:#c62828;
  text-align:center;
  margin-top:15px;
  min-height:20px;
}

</style>
</head>

<body>

<div class="card">

  <div class="logo">⭐</div>
  <h1>OPEN STARS</h1>
  <div class="subtitle">Электронный дневник модельной школы</div>

  <h2>Вход в дневник</h2>

  <label>Кто входит?</label>
  <select id="role">
    <option value="parent">Родитель</option>
    <option value="student">Ученик</option>
  </select>

  <label>Логин</label>
  <input id="login" type="text" placeholder="Введите логин">

  <label>Пароль</label>
  <input id="password" type="password" placeholder="Введите пароль">

  <button onclick="login()">Войти</button>

  <div id="error"></div>

  <div class="status">OPEN STARS ✨</div>

</div>

<script>
function login(){
  const login=document.getElementById("login").value.trim();
  const password=document.getElementById("password").value.trim();
  const role=document.getElementById("role").value;
  const error=document.getElementById("error");

  if(!login || !password){
    error.textContent="Введите логин и пароль";
    return;
  }

  error.style.color="#188038";
  error.textContent=
    role==="parent"
    ? "Вход родителя выполнен ✓"
    : "Вход ученика выполнен ✓";
}
</script>

</body>
</html>
